name: sc
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip

  # core scientific
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - statsmodels
  - matplotlib
  - seaborn
  - jupyter
  - jupyterlab
  - ipykernel
  - h5py
  - hdf5
  - pytables
  - numba
  - tqdm
  - polars

  # single-cell core
  - scanpy
  - anndata
  - leidenalg
  - python-igraph
  - umap-learn
  - louvain
  - bbknn
  - scanorama

  # genomics interval / IO
  - pyranges
  - pybedtools
  - pysam
  - pyBigWig
  - htslib
  - tabix
  - bedtools
  - samtools

  # peak calling (in case we ever pseudobulk + recall)
  - macs3

  # stats / DE
  - rpy2

  # snATAC pythonic stack — bioconda binary (avoids Rust/maturin source build)
  - snapatac2

  # plotting / label placement
  - adjusttext

  # loess smoothing (scanpy highly_variable_genes flavor="seurat_v3")
  - scikit-misc

  # random-forest feature ranking (sklearn-compatible ranger)
  - skranger

  # prior-knowledge resources (decoupler / ligand-receptor)
  - omnipath

  # enrichment / DE / prior-knowledge (conda: bioconda has all of these)
  - gseapy
  - pydeseq2
  - decoupler-py
  - gprofiler-official

  # figures / documents / IO (conda-forge)
  - cairosvg
  - weasyprint
  - upsetplot
  - matplotlib-venn
  - logomaker
  - pypdf
  - python-docx
  - markdown
  - hdf5plugin
  - pyreadr
  - xlrd
  - zopfli

  - pip:
    # no conda build exists for these
    - pychromvar
    - xenaPython
    # pinned: 0.13.0 is the last manylinux2014 wheel; newer needs glibc >2.23
    - pillow-heif==0.13.0
    # multimodal containers
    - mudata
    - muon

    # doublets
    - scrublet

    # batch integration
    - harmonypy

    # auto-annotation
    - celltypist

    # optional heavy ML — keep available for scVI/PoissonVI later
    # uncomment if/when needed (pulls in pytorch)
    # - scvi-tools
